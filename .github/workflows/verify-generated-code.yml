name: Verify generated OpenAPI code

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: generated-code-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-generated-code:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12.12"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.6"
          enable-cache: true
          cache-dependency-glob: "code/uv.lock"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: uv sync --extra dev --locked
      - run: uv run generate-source --rest-server --api test-service-server
      - run: git ls-files --error-unmatch generated/test_service_server/openapi.yaml
      - run: git diff --exit-code -- generated/
