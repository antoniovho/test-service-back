[project]
name = "test-service-back"
version = "0.1.0"
description = "Backend implementation for the Test Service OpenAPI contract"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.30,<1.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "opyoid>=4.0.0",
  "pydantic-settings>=2.7,<3.0",
  "pyjwt[crypto]>=2.15.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "test-service-server",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<10.0",
  "pytest-asyncio>=0.25,<2.0",
  "ruff>=0.9,<1.0",
  "openapi-contract-toolkit @ https://github.com/antoniovho/openapi-contract-toolkit/releases/download/v0.1.0/openapi_contract_toolkit-0.1.0-py3-none-any.whl",
  "pysonar==1.8.0.5390",
  "pytest-cov>=7.1.0",
]

[tool.openapi-contracts]
generator-command = "npx --yes @openapitools/openapi-generator-cli@2.41.0"
generator-version = "7.25.0"

[tool.openapi-contracts.contracts.test-service]
version = "0.3.0"
repository = "antoniovho/app-devtools"
tag = "test-service-api-v{version}"
artifact = "test-service-api-{version}.yml"
sha256 = "93a6beff95f5fa69fb07fd9684129124273b6bec49daa70ef8f2dc4c6873398a"
output = "contracts/open_api/test-service-api.yml"

[tool.openapi-contracts.generators.rest.server.test-service-server]
contract = "test-service"
generator = "python-fastapi"
output = "generated/test_service_server"
package-name = "test_service_server"
sourceFolder = ""

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["test_service"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
# Exclude a variety of commonly ignored directories.
exclude = [
  "generated",
  "contracts"
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.uv.sources]
test-service-server = { path = "generated/test_service_server", editable = true }
