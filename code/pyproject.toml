[project]
name = "test-service-back"
version = "0.1.0"
description = "Backend implementation for the Test Service OpenAPI contract"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.30,<1.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "jsonschema>=4.26,<5.0",
  "opyoid>=4.0.0",
  "pydantic-settings>=2.7,<3.0",
  "pyjwt[crypto]>=2.15.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "tavern>=3.0,<4.0",
  "test-service-server",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<10.0",
  "pytest-asyncio>=0.25,<2.0",
  "ruff>=0.9,<1.0",
  "openapi-contract-toolkit @ https://github.com/antoniovho/openapi-contract-toolkit/releases/download/v0.1.2/openapi_contract_toolkit-0.1.2-py3-none-any.whl",
  "pysonar==1.9.0.5762",
  "pytest-cov>=7.1.0",
  "mutmut>=3,<4",
]

[tool.openapi-contracts]
generator-command = "npx --yes @openapitools/openapi-generator-cli@2.41.0"
generator-version = "7.25.0"

[tool.openapi-contracts.contracts.test-service]
version = "0.4.0"
repository = "antoniovho/app-devtools"
tag = "test-service-api-v{version}"
artifact = "test-service-api-{version}.yml"
sha256 = "e141d3540e7cfd6b2f18d6aeab9fc6efbd3561280db2e20059cc56fe0f8291d8"
output = "contracts/open_api/test-service-api.yml"

[tool.openapi-contracts.generators.rest.server.test-service-server]
contract = "test-service"
generator = "python-fastapi"
template-profile = "python-fastapi-http"
output = "generated/test_service_server"
package-name = "test_service_server"
sourceFolder = ""

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["test_service"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
# Exclude a variety of commonly ignored directories.
exclude = [
  "generated",
  "contracts"
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mutmut]
source_paths = ["test_service/"]
on_dependency_change = "rerun"
cache_invalidation_files = ["tests/**/*.py"]
only_mutate = [
  "test_service/domain/application/use_cases/execution/executions/cancel_execution_use_case.py",
  "test_service/domain/application/use_cases/execution/executions/process_next_execution_use_case.py",
  "test_service/domain/ports/output/runners/runner_dtos.py",
  "test_service/infrastructure/adapters/output/execution/executions/execution_persistence_adapter.py",
  "test_service/infrastructure/adapters/output/execution/executions/persistence/repositories/execution_repository.py",
  "test_service/infrastructure/adapters/output/projects/jira/jira_project_validation_adapter.py",
  "test_service/infrastructure/adapters/output/runners/tavern/executors/tavern_executor.py",
  "test_service/infrastructure/adapters/output/runners/tavern/mappers/tavern_result_mapper.py",
      "test_service/infrastructure/adapters/output/runners/tavern/tavern_runner_adapter.py",
]
pytest_add_cli_args_test_selection = [
  "tests/unit/domain/application/use_cases/execution/executions/",
  "tests/unit/infrastructure/adapters/output/execution/executions/persistence/",
  "tests/unit/infrastructure/adapters/output/projects/jira/",
  "tests/unit/infrastructure/adapters/output/runners/tavern/",
]

[tool.uv.sources]
test-service-server = { path = "generated/test_service_server", editable = true }
