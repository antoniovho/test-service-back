openapi: 3.0.3
info:
  contact:
    email: avelasco.horcajada@knowmadmood.com
    name: Antonio Velasco Horcajada
  description: "API for authoring immutable test definitions, composing test plans,\
    \ executing validated plans, and publishing read-only projections to an external\
    \ testing viewer."
  title: Test Service
  version: 0.1.1
servers:
- description: Local development server
  url: http://localhost:8080
security:
- bearerAuth: []
tags:
- description: Versioned test cases and preconditions.
  name: Authoring
- description: Versioned test sets and plans.
  name: Composition
- description: Shared project catalog and administrative lifecycle.
  name: Projects
- description: Executions and immutable test results.
  name: Execution
- description: Outbound publication and drift detection.
  name: Viewer Integration
paths:
  /v1/projects:
    get:
      description: Returns a paginated list of active projects registered in the local
        Project Catalog.
      operationId: listProjects
      parameters:
      - description: Number of records to skip before returning results.
        explode: true
        in: query
        name: offset
        required: false
        schema:
          $ref: "#/components/schemas/Offset"
        style: form
      - description: Maximum number of records returned in one page.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          $ref: "#/components/schemas/Limit"
        style: form
      - description: Field used to sort the result set.
        explode: true
        in: query
        name: sortBy
        required: false
        schema:
          default: version
          enum:
          - status
          - version
          - name
          example: version
          type: string
        style: form
      - description: Sort direction.
        explode: true
        in: query
        name: order
        required: false
        schema:
          $ref: "#/components/schemas/SortOrder"
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
          description: Active projects.
        "400":
          content:
            application/problem+json:
              example:
                type: /problems/bad-request
                status: 400
                title: Bad Request
                detail: The request is invalid.
              schema:
                $ref: "#/components/schemas/ErrorDetails"
          description: The request is invalid.
        "401":
          content:
            application/problem+json:
              example:
                type: /problems/unauthorized
                status: 401
                title: Unauthorized
                detail: Authentication is required or the credentials are invalid.
              schema:
                $ref: "#/components/schemas/ErrorDetails"
          description: Authentication is required or failed.
        "403":
          content:
            application/problem+json:
              example:
                type: /problems/forbidden
                status: 403
                title: Forbidden
                detail: The authenticated principal lacks the required permission.
              schema:
                $ref: "#/components/schemas/ErrorDetails"
          description: The authenticated principal is not allowed to perform the operation.
        "404":
          content:
            application/problem+json:
              example:
                type: /problems/not-found
                status: 404
                title: Not Found
                detail: The requested resource was not found.
              schema:
                $ref: "#/components/schemas/ErrorDetails"
          description: The requested resource was not found.
        "409":
          content:
            application/problem+json:
              example:
                type: /problems/conflict
                status: 409
                title: Conflict
                detail: The resource state conflicts with this operation.
              schema:
                $ref: "#/components/schemas/ErrorDetails"
          description: The operation conflicts with the current state of the resource.
        "422":
          content:
            application/problem+json:
              example:
                type: /problems/domain-validation
                status: 422
                title: Unprocessable Entity
                detail: The request violates a domain rule.
              schema:
                $ref: "#/components/schemas/ErrorDetails"
          description: The request is syntactically valid but violates a domain rule.
        "500":
          content:
            application/problem+json:
              example:
                type: /problems/internal-server-error
                status: 500
                title: Internal Server Error
                detail: An unexpected server error occurred.
              schema:
                $ref: "#/components/schemas/ErrorDetails"
          description: An unexpected server error occurred.
        "503":
          content:
            application/problem+json:
              example:
                type: /problems/service-unavailable
                status: 503
                title: Service Unavailable
                detail: The service is temporarily unavailable.
              schema:
                $ref: "#/components/schemas/ErrorDetails"
          description: The service is temporarily unavailable.
