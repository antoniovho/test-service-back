          offset: 0
          limit: 20
          total: 0
      properties:
        data:
          description: Drift events in the current page.
          items:
            $ref: "#/components/schemas/DriftEvent"
          maxItems: 100
          type: array
        pagination:
          $ref: "#/components/schemas/Pagination"
      required:
      - data
      - pagination
      title: DriftEventListResponse
      type: object
