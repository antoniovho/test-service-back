[metadata]
name = test_service_server
version = 1.0.0
description = API for authoring immutable test definitions, composing test plans, executing validated plans, and publishing read-only projections to an external testing viewer.
long_description = file: README.md
keywords = OpenAPI Test Service
python_requires = >= 3.10.*
classifiers =
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10

[options]
install_requires = fastapi[all]
setup_requires = setuptools
package_dir = =
packages = find_namespace:

[options.packages.find]
where = 
